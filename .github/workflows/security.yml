name: DevSecOps Security Pipeline

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Secret scan - Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --exit-code 1

      - name: SAST scan - Semgrep
        if: always()
        run: |
          python -m pip install semgrep
          semgrep scan --config auto --error

      - name: Dependency scan - Trivy
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:latest fs --scanners vuln --exit-code 0 /repo
